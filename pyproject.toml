[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-risk-ml-pipeline"
version = "0.1.0"
description = "A reproducible baseline pipeline for imbalanced payment risk classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdelrhman Ashmawi" }]
dependencies = [
  "joblib>=1.4,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1.0"
]

[project.scripts]
payment-risk = "payment_risk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
